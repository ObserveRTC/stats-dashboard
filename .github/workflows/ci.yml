# Every push and pull request: the same three gates the Docker build runs, so a
# red CI and a failed image build mean the same thing.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci`, not `install`: it installs exactly the lockfile and fails if the
      # two have drifted, which is the point of having a lockfile.
      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Offline — the suites read fixtures in scripts/fixtures, not the network.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

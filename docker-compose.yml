# A complete local stack: the dashboard plus a MinIO bucket to point it at.
#
#   docker compose up --build
#   → dashboard  http://localhost:3000
#   → MinIO UI   http://localhost:9001  (minioadmin / minioadmin)
#
# Drop `<roomId>/<callId>/…` objects into the `observertc` bucket and they show
# up in the dashboard. This is a development convenience, not a production
# topology — the credentials below are the well-known MinIO defaults and are
# fine only because nothing here is exposed beyond localhost.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once and exits — the dashboard lists a bucket rather
  # than creating one, so something has to make it first.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/observertc &&
      echo 'bucket ready'
      "

  dashboard:
    build:
      context: .
      # Empty means the browser calls /api on the same origin, which is what
      # this compose file serves.
      args:
        NEXT_PUBLIC_API_BASE_URL: ''
    depends_on:
      createbucket:
        condition: service_completed_successfully
    environment:
      # The server reaches MinIO by service name on the compose network...
      S3_ENDPOINT: http://minio:9000
      # ...but a presigned URL is followed by the *browser*, which resolves
      # `minio` to nothing. A signature is bound to the host it was made for, so
      # browser-facing URLs are signed against the published address instead.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: observertc
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
